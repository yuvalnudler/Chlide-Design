name: ci

on:
  push: {branches: [main]}
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      # GPU tests are opt-in via the `gpu` marker; pyproject deselects them by default.
      # Nothing here touches a card, and nothing here is allowed to.
      - name: pytest
        run: pytest -q
      - name: ruff
        run: ruff check .
      - name: campaigns validate
        run: chlide validate campaigns/v7-boltz-coo.yaml campaigns/v8-af3-coo.yaml
