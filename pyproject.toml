[project]
name = "chlide-design"
version = "0.1.0"
description = "Consolidated pipeline for designing chlorophyllide-binding proteins"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pyyaml",
    "numpy",
    "pandas",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff"]

[project.scripts]
chlide = "chlide.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests that need a GPU are opt-in: pytest -m gpu
markers = [
    "gpu: requires a free GPU and the boltz/af3 conda envs",
    "slow: takes more than a few seconds",
]
addopts = "-m 'not gpu' --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Migrated verbatim from the campaigns. Their long lines are the COLUMN TABLES --
# one row per reported measure, each carrying the tooltip that explains it. Wrapping
# those strings would break the table's alignment, which is what makes it readable.
# The ignore is per-file and deliberate; it lifts when these become src/chlide/stages/.
"tools/make_report.py" = ["E501"]
"tools/paper_figures.py" = ["E501"]
"tools/sasa_rank.py" = ["E501"]
"tools/crossfold.py" = ["E501"]
"tools/af3_interface_pae.py" = ["E501"]
"tools/af3_monomer.py" = ["E501"]
"tools/polizzi_cascade.py" = ["E501"]
"tools/boltz_coord_patch.py" = ["E501"]
"tools/nise_telegram_report.py" = ["E501", "E402", "E741"]
# The NISE driver, merged verbatim from the two campaign copies. Reformatting it would
# destroy the line-by-line correspondence that makes the merge auditable.
"src/chlide/nise_driver.py" = ["E501", "E741", "F403", "F405", "E402", "B006", "B007", "B023"]
"tools/af3_adapter.py" = ["E501"]
"tools/harvest_global_top.py" = ["E501"]
"tools/relax_pool.py" = ["E501"]
"tools/final_shortlist.py" = ["E501"]
"tools/rosetta_relax.py" = ["E501"]
"tools/burial_rescore.py" = ["E501"]

"tools/calibrate_af3_gates.py" = ["E501"]
"tools/rebuild_claox_conformer.py" = ["E501"]
"tools/recalibrate_gates.py" = ["E501"]
"tools/relax_replicates.py" = ["E501"]
"tools/repair_cla_oxy.py" = ["E501"]
"tools/replay_convergence.py" = ["E501"]